# Host ports come from env vars so parallel worktrees / test runs don't collide (0 = random).
# Postgres is only for debugging from the host: localhost-only, random port unless POSTGRES_PORT
# is set. `run.py up` picks a free API port (8000 if available) unless API_PORT is set.
# Set COMPOSE_PROJECT_NAME (or `-p`) per worktree.

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-movies}:${POSTGRES_PASSWORD:-movies}@postgres:5432/${POSTGRES_DB:-movies}
  # Required (16+ characters); the services refuse to start without it. `run.py up` generates one.
  API_KEY: ${API_KEY:-}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-67108864}
  STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-5000}
  DATA_DIR: /data
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-5}
  JOB_STALE_SECONDS: ${JOB_STALE_SECONDS:-60}
  JOB_SWEEP_INTERVAL_SECONDS: ${JOB_SWEEP_INTERVAL_SECONDS:-15}
  REDIS_URL: redis://redis:6379/0
  CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
  CACHE_MAX_AGE_SECONDS: ${CACHE_MAX_AGE_SECONDS:-3600}
  CACHE_RETRY_SECONDS: ${CACHE_RETRY_SECONDS:-10}
  MAX_EVENT_STREAMS: ${MAX_EVENT_STREAMS:-1000}
  DATASET_VERSION_REFRESH_SECONDS: ${DATASET_VERSION_REFRESH_SECONDS:-5}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movies}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movies}
      POSTGRES_DB: ${POSTGRES_DB:-movies}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Cache only (DESIGN.md §13): no persistence, bounded memory, LRU eviction.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    restart: unless-stopped
    environment: *app-env
    volumes:
      - data:/data
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # The API runs without Redis (fail-open); this only orders startup.
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

volumes:
  pgdata:
  data:
