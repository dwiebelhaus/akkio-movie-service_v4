name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only the latest run per branch matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: movie_service

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: movie_service/uv.lock
      - run: uv sync --frozen
      - run: uv run python run.py test tests/unit -v

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: movie_service/uv.lock
      - run: uv sync --frozen
      # pytest-docker builds and starts an isolated Compose stack (random ports); tests talk to
      # it over real HTTP with httpx. The stack is kept so its logs can be shown on failure.
      - run: uv run python run.py test tests/e2e -v
        env:
          E2E_KEEP_STACK: "1"
      - name: Service logs
        if: failure()
        run: |
          for project in $(docker compose ls --all --format json | jq -r '.[].Name'); do
            docker compose -p "$project" logs --no-color --tail 300
          done
